# Production Docker Compose Configuration
# For Unraid deployment with optimized settings

version: '3.8'

services:
  master-order:
    build: 
      context: .
      dockerfile: Dockerfile  # Use the production Dockerfile
    container_name: master-order
    ports:
      - "3001:3001"
    volumes:
      # Database and uploads persistence
      - ./master_order.db:/app/master_order.db
      - ./data:/app/data
      # Mount Plex media paths for metadata extraction
      - /mnt/user/Media/Christmas:/xmas:ro
      - /mnt/user/Media/Movies:/movies:ro
      - /mnt/user/Media/Music:/music:ro
      - /mnt/user/Media/Classical:/classical:ro
      - /mnt/user/Media/TV:/tv:ro
      - /mnt/user/Media/VideoGames:/video_games:ro
      - /mnt/user/Media/PopMusic:/pop_music:ro
      # Background images persistent storage
      - /mnt/user/Media/Other/Images/background-images:/mnt/user/Media/Other/Images/background-images
    environment:
      - NODE_ENV=production
      - PORT=3001
      # UNC path translation for Docker/Unraid background image storage
      - "UNRAID_SERVER_NAME=tower"
      - "UNRAID_SHARE_ROOT=/mnt/user"
      - "PLEX_PATH_1=/xmas"
      - "LOCAL_PATH_1=/xmas"
      - "PLEX_PATH_2=/movies"
      - "LOCAL_PATH_2=/movies"
      - "PLEX_PATH_3=/music"
      - "LOCAL_PATH_3=/music"
      - "PLEX_PATH_4=/classical"
      - "LOCAL_PATH_4=/music"
      - "PLEX_PATH_5=/tv"
      - "LOCAL_PATH_5=/tv"
      - "PLEX_PATH_6=/video_games"
      - "LOCAL_PATH_6=/video_games"
      - "PLEX_PATH_7=/pop_music"
      - "LOCAL_PATH_7=/pop_music"
      - "BACKGROUND_UNC_PATH_MAPPINGS=//tower/Media/Other/Images/background-images=/mnt/user/Media/Other/Images/background-images"
      # External IP for Android API responses - UPDATE THIS FOR YOUR NETWORK
      - "EXTERNAL_IP=192.168.1.114"
      # Gemini AI API Key for AI categorization features
      - "GEMINI_API_KEY=AIzaSyAdXnyNUU6VYg8_ERsb9N5MxyowhAMJlFU"
    restart: unless-stopped
    networks:
      - master-order-network

networks:
  master-order-network:
    driver: bridge
