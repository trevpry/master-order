version: '3.8'

# 🔒 DATA SAFETY REQUIRED: Run ./verify-safety.sh BEFORE deployment
# This prevents data loss incidents like the one that occurred on 2025-09-18

services:
  master-order:
    build: .
    container_name: master-order
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "stash.internal:192.168.1.154"
      - "plex.local:192.168.1.116"
    volumes:
      # Persistent data storage - Updated paths for Unraid
      - /mnt/user/appdata/master-order/data:/app/data
      - /mnt/user/appdata/master-order/artwork-cache:/app/server/artwork-cache
      - /mnt/user/appdata/master-order/logs:/app/logs
      # History Plus CSV import directory (optional - only needed if using import button)
      - /mnt/user/appdata/master-order/history-plus-export:/app/history-plus-export:ro
      # Mount Plex media paths - REQUIRED for metadata extraction
      - /mnt/user/Media/Christmas:/xmas:ro
      - /mnt/user/Media/Movies:/movies:ro
      - /mnt/user/Media/Music:/music:ro
      - /mnt/user/Media/Classical:/classical:ro
      - /mnt/user/Media/TV:/tv:ro
      - /mnt/user/Media/VideoGames:/video_games:ro
      - /mnt/user/Media/PopMusic:/pop_music:ro
    environment:
      - NODE_ENV=production
      # Connect to PostgreSQL using Unraid IP address
      - "DATABASE_URL=postgresql://master_order_user:secure_password_change_me@192.168.1.114:5432/master_order"
      - "POSTGRES_PASSWORD=secure_password_change_me"
      - PORT=3001
      # Data directory for persistent uploads and user data
      - "DATA_PATH=/app/data"
      # External IP for Android API responses - UPDATE THIS WHEN IP CHANGES
      - "EXTERNAL_IP=192.168.1.114"
      # Stash server configuration - Now managed in database settings
      # Primary URL should be configured in Eddie settings, fallbacks still available
      # - "STASH_URL=http://stash.internal:9999"
      - "STASH_URL_FALLBACK_1=http://192.168.1.154:9999"
      - "STASH_URL_FALLBACK_2=http://192.168.1.114:9999"
      - "STASH_URL_FALLBACK_3=http://localhost:9999"
      - "STASH_URL_FALLBACK_4=http://host.docker.internal:9999"
      # Add your API keys and settings here or use a .env file
      # - PLEX_URL=http://your-plex-server:32400
      # - PLEX_TOKEN=your-plex-token
      # - TVDB_API_KEY=your-tvdb-api-key
      # - COMICVINE_API_KEY=your-comicvine-api-key
      # Gemini AI API Key for AI categorization features
      - "GEMINI_API_KEY=AIzaSyAdXnyNUU6VYg8_ERsb9N5MxyowhAMJlFU"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  master-order-data:
  master-order-artwork:
  master-order-logs:
