xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@class="mt-3 mb-1 h5"]/text()
      Details: //span[@class="lh15 opacity-70"]/text()
      URL: &url //link[@rel="alternate" and hreflang="en"]/@href
      # Date: &date
      #   selector: //script[@type="application/ld+json"]/text()
      #   postProcess:
      #     - replace:
      #         - regex: .*"datePublished"\s*:\s*"([^"]+)".*
      #           with: $1
      Groups:
        Name: 
          selector: //h3[@class="h90"]/text()
          postProcess:
          - replace:
              - regex: "DVD: "
                with: ""
        URL: 
          selector: //h3[@class="h90"]/parent::a/@href
          postProcess:
          - replace:
              - regex: ^
                with: https://www.berryboys.fr
      Image:
        selector: //div[@class="pb-2 pl-1 row"]/div[1]//img/@src
      Studio:
        Name: 
          fixed: "BerryBoys"
      Performers:
        Name: //div[contains(@class, "text-terciary") and contains(@class, "text-truncate")]
        URL: //div[@class="mt-4"]//a[contains(@class, "h100")]/@href
      Tags:
        Name: 
          selector: //h3[@class="h120"]/text()
  movieScraper:
    movie:
      Title: 
        selector: //h1[@class="h4 text-dark"]/text()     
      Image: 
        selector: //div[@class="mb-2 embed-responsive embed-responsive-2by3"]/img/@src
  performerScraper:
    performer:
      Name: 
        selector: //div[@class="p-1 pt-2 text-center h90 text-terciary -bg-black-50 text-truncate"]/text()
        postProcess:
          - replace:
              - regex: "\""
                with: "" 
      Gender:
        fixed: Male       
      URL:
        selector: //link[@rel="canonical"]/@content
      Image: 
        selector: //img[@class="border embed-responsive-item bg-light border-dark obj-cover"]/@src
  sceneSearchScraper:
    # Search for scenes on a performer's page
    scene:
      Title: //a[@class="px-3 pt-3 pb-0 text-center d-block h110 text-truncate text-primary font-weight-bold"]/text()
      URL:
        selector: //a[@class="px-3 pt-3 pb-0 text-center d-block h110 text-truncate text-primary font-weight-bold"]/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.berryboys.fr
      Image:
        selector: //div[@class="rounded embed-responsive embed-responsive-16by9"]/img/@src
  performerSearchScraper:
    # Search for performers - returns list of matching performers with URLs
    performer:
      Name: //div[@class="pb-1 m-2 text-center b-0 l-0 r-0 h6 text-truncate text-dark"]/text()
      URL:
        selector: //a[@class="mb-3 col-xxl-2 col-xl-3 col-md-3 col-sm-4 col-6 "]/@href 
        postProcess:
          - replace:
              - regex: ^
                with: https://www.berryboys.fr
      Image:
        selector: //div[@class="rounded embed-responsive embed-responsive-16by9"]/img/@src    
      performerSceneScraper: performerSceneScraper
  performerSceneScraper:
    # Extract scenes from a performer's detail page
    scene:
      Title: //a[@class="px-3 pt-3 pb-0 text-center d-block h110 text-truncate text-primary font-weight-bold"]/text()
      URL:
        selector: //a[@class="px-3 pt-3 pb-0 text-center d-block h110 text-truncate text-primary font-weight-bold"]/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.berryboys.fr
      Performers:
        Name: //div[contains(@class, "text-terciary") and contains(@class, "text-truncate")]
        URL: //div[@class="mt-4"]//a[contains(@class, "h100")]/@href    


