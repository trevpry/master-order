<!DOCTYPE html>
<html>
<head>
    <title>Stash Play Test</title>
</head>
<body>
    <h2>Stash Connection Test</h2>
    <div id="status"></div>
    <br>
    <button id="testPlay" disabled>Test Play Button</button>
    
    <script>
        async function testConnection() {
            const statusDiv = document.getElementById('status');
            const playButton = document.getElementById('testPlay');
            
            try {
                const response = await fetch('http://localhost:3001/api/stash/test');
                const result = await response.json();
                
                console.log('Stash test response:', result);
                
                const stashUrl = result.url || null;  // This is what our fix should use
                statusDiv.innerHTML = `
                    <strong>Connection Status:</strong><br>
                    Connected: ${result.success}<br>
                    Configured: ${result.configured}<br>
                    Stash URL: ${stashUrl}<br>
                    Has API Key: ${result.hasApiKey}
                `;
                
                // Enable play button if we have a stash URL (mimicking frontend logic)
                if (stashUrl) {
                    playButton.disabled = false;
                    playButton.textContent = 'Play Test (Enabled)';
                } else {
                    playButton.textContent = 'Play Test (Disabled - No URL)';
                }
                
            } catch (error) {
                statusDiv.innerHTML = `Error: ${error.message}`;
            }
        }
        
        document.getElementById('testPlay').addEventListener('click', async () => {
            const testData = {
                action: 'play',
                scene: {
                    id: '26125',
                    title: 'Test Scene',
                    streamUrl: 'http://192.168.1.118:9999/scene/26125/stream.m3u8',
                    stashUrl: 'http://192.168.1.118:9999'
                }
            };
            
            try {
                const response = await fetch('http://localhost:3001/api/android/play', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                console.log('Play response status:', response.status);
                const result = await response.text();
                console.log('Play response:', result);
                alert('Play command sent! Check console for details.');
            } catch (error) {
                console.error('Error sending play command:', error);
                alert('Error: ' + error.message);
            }
        });
        
        // Test connection on page load
        testConnection();
    </script>
</body>
</html>
